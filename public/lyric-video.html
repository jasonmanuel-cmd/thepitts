  background:repeating-linear-gradient(to bottom,transparent 0,transparent 2px,rgba(0,0,0,0.1) 2px,rgba(0,0,0,0.1) 4px);
}
/* vignette — lighter so bg shows more */
#vignette{
  position:absolute;inset:0;pointer-events:none;z-index:3;
  background:radial-gradient(ellipse 85% 75% at center,transparent 30%,rgba(0,0,0,0.78) 100%);
}
/* noise grain */
#noise{
  position:absolute;inset:0;opacity:0.025;pointer-events:none;z-index:4;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  animation:noiseAnim 0.1s steps(1) infinite;
}
@keyframes noiseAnim{0%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(2px,-2px)}75%{transform:translate(-1px,3px)}100%{transform:translate(3px,0)}}

/* scratch lines */
#scratches{position:absolute;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.scratch{position:absolute;top:0;bottom:0;width:1px;
  background:linear-gradient(to bottom,transparent 0%,rgba(180,0,0,0.1) 20%,rgba(180,0,0,0.15) 50%,rgba(180,0,0,0.1) 80%,transparent 100%);
  animation:scratchMove linear infinite;opacity:0;
}
.scratch:nth-child(1){left:12%;animation-duration:11s;animation-delay:0s}
.scratch:nth-child(2){left:39%;animation-duration:7s;animation-delay:3s}
.scratch:nth-child(3){left:68%;animation-duration:9s;animation-delay:6s}
.scratch:nth-child(4){left:86%;animation-duration:13s;animation-delay:1.5s}
@keyframes scratchMove{0%{opacity:0;transform:translateY(-100%)}10%{opacity:1}90%{opacity:0.5}100%{opacity:0;transform:translateY(100%)}}

/* cinematic bars */
.bar{position:absolute;left:0;right:0;height:88px;background:#000;z-index:10}
.bar.top{top:0}.bar.bottom{bottom:0}

/* ── TITLE CARD ── */
#title-card{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:20;
  opacity:1;transition:opacity 2s ease;
}
#title-card.hidden{opacity:0;pointer-events:none}
.t-band{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:120px;
  letter-spacing:0.1em;color:#f0ece4;text-transform:uppercase;
  text-shadow:5px 5px 0 #8b0000,0 0 100px rgba(180,0,0,0.4);
  animation:titleIn 1s cubic-bezier(0.16,1,0.3,1) forwards;opacity:0;
}
.t-rule{width:600px;height:2px;margin:18px auto;animation:titleIn 0.8s 0.2s ease forwards;opacity:0;
  background:linear-gradient(90deg,transparent,#cc1111,transparent);}
.t-song{
  font-family:'Special Elite',cursive;font-size:46px;color:#cc1111;
  letter-spacing:0.25em;text-shadow:2px 2px 0 #000,0 0 30px rgba(180,0,0,0.5);
  animation:titleIn 0.8s 0.3s ease forwards;opacity:0;
}
.t-sub{
  font-family:'Barlow Condensed',sans-serif;font-size:15px;letter-spacing:0.6em;
  font-style:italic;color:rgba(200,200,200,0.4);margin-top:14px;text-transform:uppercase;
  animation:titleIn 0.6s 0.5s ease forwards;opacity:0;
}
@keyframes titleIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ── LYRICS ── */
#lyrics-stage{
  position:absolute;inset:88px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;z-index:15;pointer-events:none;
}
#section-lbl{
  font-family:'Oswald',sans-serif;font-size:15px;letter-spacing:0.65em;
  color:#cc1111;opacity:0;margin-bottom:18px;transition:opacity 0.5s ease;text-transform:uppercase;
}
#section-lbl.on{opacity:0.55}

#lyric-display{
  font-family:'Special Elite',cursive;color:#f0ece4;text-align:center;
  line-height:1.2;max-width:1560px;padding:0 60px;
  opacity:0;transform:translateY(14px);
  transition:opacity 0.38s ease,transform 0.38s cubic-bezier(0.16,1,0.3,1);
  text-shadow:3px 3px 0 rgba(0,0,0,0.98),0 0 50px rgba(0,0,0,0.9);
}
#lyric-display.in{opacity:1;transform:translateY(0)}
#lyric-display.out{opacity:0;transform:translateY(-10px);transition:opacity 0.28s ease,transform 0.28s ease}
#lyric-display.verse{font-size:66px}
#lyric-display.chorus{
  font-family:'Oswald',sans-serif;font-weight:700;font-size:96px;
  letter-spacing:0.05em;color:#fff;
  text-shadow:5px 5px 0 #8b0000,0 0 90px rgba(180,0,0,0.4),3px 3px 0 rgba(0,0,0,0.98);
}
#lyric-display.outro{font-size:62px;color:#d0ccc4}
#lyric-display.solo{font-size:0px}
#lyric-display.blank{font-size:0px}
.first-word{
  font-size:1.6em;font-weight:900;display:inline-block;line-height:1;
  transform-origin:center bottom;
  animation:wordPop 0.45s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes wordPop{
  0%{transform:scale(0.3);opacity:0}
  60%{transform:scale(1.22);opacity:1}
  100%{transform:scale(1);opacity:1}
}

/* SOLO section label special */
#section-lbl.solo-mode{
  font-size:22px;letter-spacing:0.8em;opacity:0.4!important;
  color:rgba(200,180,140,0.6);
}

/* ── PROGRESS + TIMER ── */
#prog{
  position:absolute;bottom:88px;left:0;height:3px;width:0%;z-index:20;
  background:linear-gradient(90deg,#8b0000,#cc1111,#ff4444);
  box-shadow:0 0 12px rgba(200,0,0,0.8);transition:width 0.25s linear;
}
#timer{
  position:absolute;bottom:100px;left:48px;
  font-family:'Oswald',sans-serif;font-size:14px;
  letter-spacing:0.3em;color:rgba(200,0,0,0.4);z-index:20;
}
#wm{
  position:absolute;bottom:100px;right:48px;
  font-family:'Special Elite',cursive;font-size:13px;
  letter-spacing:0.2em;color:rgba(180,0,0,0.3);z-index:20;text-transform:uppercase;
}

/* ── BEAT PULSE ── */
#pulse{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:6;
  background:rgba(140,0,0,0.08);}
#pulse.pop{animation:popFlash 0.18s ease-out forwards}
@keyframes popFlash{0%{opacity:1}100%{opacity:0}}

/* ── PLAY BTN ── */
#play-btn{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:30;
  background:rgba(0,0,0,0.88);border:2px solid #cc1111;color:#cc1111;
  font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;
  letter-spacing:0.45em;padding:22px 60px;cursor:pointer;text-transform:uppercase;
  transition:all 0.2s ease;box-shadow:0 0 30px rgba(180,0,0,0.25);
}
#play-btn:hover{background:rgba(140,0,0,0.25);color:#fff;box-shadow:0 0 50px rgba(180,0,0,0.5)}
#play-btn.gone{display:none}
#timing-btn{
  position:fixed;bottom:20px;right:20px;z-index:50;
  background:rgba(20,20,20,0.85);border:1px solid #444;color:#aaa;
  font-size:14px;padding:8px 16px;border-radius:6px;cursor:pointer;letter-spacing:0.05em;
}
#timing-btn:hover{border-color:#888;color:#fff}
#timing-btn.gone{display:none}
/* ── TIMING OVERLAY ── */
#timing-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,0.97);z-index:200;
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  font-family:'Special Elite',cursive;
}
#timing-overlay.active{display:flex}
#t-label{font-size:13px;letter-spacing:0.3em;color:#555;text-transform:uppercase}
#t-next{font-size:52px;color:#fff;text-align:center;max-width:900px;line-height:1.2;
  text-shadow:0 0 40px rgba(255,255,255,0.15)}
#t-up{font-size:26px;color:#444;margin-top:4px;text-align:center;max-width:800px}
#t-hint{font-size:15px;color:#333;margin-top:24px;letter-spacing:0.15em}
#t-timer{font-size:22px;color:#c00;font-family:monospace;margin-top:8px}
#t-results{display:none;font-family:monospace;font-size:13px;color:#0f0;
  background:#0a0a0a;border:1px solid #222;padding:20px 24px;
  max-height:70vh;overflow-y:auto;white-space:pre;width:90%;max-width:900px;border-radius:8px}
#t-copy{display:none;margin-top:12px;padding:10px 24px;background:#8b0000;color:#fff;
  border:none;border-radius:6px;font-size:15px;cursor:pointer;letter-spacing:0.05em}
#t-copy:hover{background:#b00000}
#t-close{position:fixed;top:20px;right:28px;font-size:28px;color:#333;cursor:pointer;z-index:201}
#t-close:hover{color:#fff}
</style>
</head>
<body>

<div id="bg1"></div>
<div id="bg2"></div>
<div id="scanlines"></div>
<div id="vignette"></div>
<div id="noise"></div>
<div id="pulse"></div>
<div id="scratches">
  <div class="scratch"></div><div class="scratch"></div>
  <div class="scratch"></div><div class="scratch"></div>
</div>
<div class="bar top"></div>
<div class="bar bottom"></div>
<div id="prog"></div>
<div id="timer">0:00</div>
<div id="wm">Poison Well Records</div>

<div id="title-card">
  <div class="t-band">The Pitts</div>
  <div class="t-rule"></div>
  <div class="t-song">Jamestown</div>
  <div class="t-sub">Poison Well Records</div>
</div>

<div id="lyrics-stage">
  <div id="section-lbl"></div>
  <div id="lyric-display"></div>
</div>

<audio id="song" src="01 - The Pitts - Jamestown - Jamestown.mp3"></audio>
<button id="play-btn" onclick="startVideo()">&#9654;&nbsp;&nbsp;Play</button>
<button id="timing-btn" onclick="startTimingMode()">⏱ Timing Mode</button>

<!-- TIMING OVERLAY -->
<div id="timing-overlay">
  <span id="t-close" onclick="closeTimingMode()">✕</span>
  <div id="t-label">Next lyric — press SPACEBAR when you hear it</div>
  <div id="t-next"></div>
  <div id="t-up"></div>
  <div id="t-timer">0:00</div>
  <div id="t-hint">SPACEBAR = stamp this line &nbsp;|&nbsp; ESC = cancel</div>
  <pre id="t-results"></pre>
  <button id="t-copy" onclick="copyTimings()">📋 Copy Timestamps</button>
</div>

<script>
// Absolute timestamps (seconds into song) for each lyric line
// Cues: first word 0:27, chorus1 1:08, solo 1:23-1:45, chorus2 2:30
const LYRICS = [
  // Verse 1
  { text: "Maybe she's better off with him",              start: 24.7,  type: "verse",  section: "Verse I" },
  { text: "Call you on a holiday, my friend",             start: 29.8,  type: "verse",  section: "" },
  { text: "Maybe I'm just stuck here for days",           start: 35.8,  type: "verse",  section: "" },
  { text: "Caught up in collection",                      start: 41.3,  type: "verse",  section: "" },
  { text: "Earn myself a modest wage",                    start: 44.8,  type: "verse",  section: "" },
  { text: "Because I've been here a thousand times before", start: 47.1, type: "verse", section: "" },
  { text: "Don't really care about being scared",         start: 52.7,  type: "verse",  section: "" },
  { text: "And I could care less about unprepared",       start: 55.0,  type: "verse",  section: "" },
  { text: "And now the devil's knocking at my door",      start: 57.7,  type: "verse",  section: "" },
  { text: "Don't really care about wrong or right",       start: 63.8,  type: "verse",  section: "" },
  { text: "And I could care less about fight or flight",  start: 66.2,  type: "verse",  section: "" },
  // Chorus 1
  { text: "Lost in the wind",   start: 70.4,  type: "chorus", section: "Chorus" },
  { text: "Black Tar Heroin",   start: 73.2,  type: "chorus", section: "" },
  { text: "Killing all my kin", start: 75.9,  type: "chorus", section: "" },
  { text: "After a while...",   start: 80.4,  type: "chorus", section: "" },
  // Solo
  { text: "",                   start: 83.1,  type: "solo",   section: "Guitar Solo" },
  // Verse 2
  { text: "Maybe I'm just better off alone",              start: 105.7, type: "verse",  section: "Verse II" },
  { text: "Call you on a roadside phone",                 start: 110.7, type: "verse",  section: "" },
  { text: "Maybe I'm just tired of shit undone",          start: 116.8, type: "verse",  section: "" },
  { text: "Take good care of my wife",                    start: 121.6, type: "verse",  section: "" },
  { text: "My three year old son",                        start: 125.2, type: "verse",  section: "" },
  { text: "Because I've been here a thousand times before", start: 127.8, type: "verse", section: "" },
  { text: "Don't really care about being scared",         start: 133.5, type: "verse",  section: "" },
  { text: "And I could care less about unprepared",       start: 135.9, type: "verse",  section: "" },
  { text: "And now the devil's knocking at my door",      start: 138.4, type: "verse",  section: "" },
  { text: "Don't really care about wrong or right",       start: 145.0, type: "verse",  section: "" },
  { text: "And I could care less about fight or flight",  start: 147.3, type: "verse",  section: "" },
  // Chorus 2
  { text: "Lost in the wind",   start: 151.4, type: "chorus", section: "Chorus" },
  { text: "Black Tar Heroin",   start: 154.0, type: "chorus", section: "" },
  { text: "Killing all my kin", start: 156.8, type: "chorus", section: "" },
  { text: "After a while...",   start: 161.4, type: "chorus", section: "" },
  { text: "After a while...",   start: 164.3, type: "chorus", section: "" },
  // Outro reprise
  { text: "Maybe I'm just better off alone",          start: 164.9, type: "verse", section: "Outro" },
  { text: "Call you on an outside phone, maybe",      start: 171.7, type: "verse", section: "" },
  { text: "Maybe I'm just tired of shit I've done",   start: 175.5, type: "verse", section: "" },
  { text: "Take good care of my wife",                start: 180.2, type: "verse", section: "" },
  { text: "My three year old son",                    start: 183.0, type: "verse", section: "" },
  { text: "And I've been here a thousand times before", start: 186.2, type: "outro", section: "" },
];

const TOTAL_MS = 202000; // 3:22
const BG_CYCLE = 14000;

const audio     = document.getElementById('song');
const display   = document.getElementById('lyric-display');
const secLbl    = document.getElementById('section-lbl');
const titleCard = document.getElementById('title-card');
const prog      = document.getElementById('prog');
const timerEl   = document.getElementById('timer');
const bg1       = document.getElementById('bg1');
const bg2       = document.getElementById('bg2');
const pulse     = document.getElementById('pulse');

let running   = false;
let bgCurrent = 1;
let nextIdx   = 0;

function updateTimer(t) {
  const s   = Math.floor(t);
  const m   = Math.floor(s / 60);
  const sec = s % 60;
  timerEl.textContent = m + ':' + String(sec).padStart(2, '0');
  prog.style.width = ((t / (TOTAL_MS / 1000)) * 100) + '%';
}

function doPulse() {
  pulse.classList.remove('pop');
  void pulse.offsetWidth;
  pulse.classList.add('pop');
}

function cycleBg() {
  if (!running) return;
  if (bgCurrent === 1) {
    bg1.style.opacity = '0'; bg2.style.opacity = '1'; bgCurrent = 2;
  } else {
    bg1.style.opacity = '1'; bg2.style.opacity = '0'; bgCurrent = 1;
  }
  setTimeout(cycleBg, BG_CYCLE);
}

function showLine(entry) {
  const { text, type, section } = entry;
  display.classList.remove('in');
  display.classList.add('out');
  secLbl.classList.remove('on', 'solo-mode');

  setTimeout(() => {
    display.classList.remove('out','verse','chorus','outro','solo','blank');
    display.classList.add(type);

    // Big first word on verse + outro lines
    if ((type === 'verse' || type === 'outro') && text) {
      const spaceIdx = text.indexOf(' ');
      if (spaceIdx !== -1) {
        display.innerHTML = '<span class="first-word">' + text.slice(0, spaceIdx) + '</span>' + text.slice(spaceIdx);
      } else {
        display.innerHTML = '<span class="first-word">' + text + '</span>';
      }
    } else {
      display.textContent = text;
    }

    if (section) {
      secLbl.textContent = section;
      secLbl.classList.add('on');
      if (type === 'solo') secLbl.classList.add('solo-mode');
    }
    void display.offsetHeight;
    display.classList.add('in');

    if (type === 'chorus') {
      doPulse();
      setTimeout(doPulse, 60000 / 86 * 2);
      setTimeout(doPulse, 60000 / 86 * 4);
    }
  }, 300);
}

function tick() {
  if (!running) return;
  const t = audio.currentTime;
  updateTimer(t);

  while (nextIdx < LYRICS.length && t >= LYRICS[nextIdx].start) {
    showLine(LYRICS[nextIdx]);
    nextIdx++;
  }

  if (nextIdx >= LYRICS.length && t >= TOTAL_MS / 1000) {
    setTimeout(() => titleCard.classList.remove('hidden'), 2000);
    return;
  }
  requestAnimationFrame(tick);
}

function startVideo() {
  document.getElementById('play-btn').classList.add('gone');
  document.getElementById('timing-btn').classList.add('gone');
  running = true;
  nextIdx = 0;
  audio.play();
  setTimeout(() => titleCard.classList.add('hidden'), 5000);
  setTimeout(cycleBg, BG_CYCLE);
  requestAnimationFrame(tick);
}

// ── TIMING MODE ──────────────────────────────────────────────
let tIdx = 0;
let tResults = [];
let tRaf = null;

function startTimingMode() {
  document.getElementById('play-btn').classList.add('gone');
  document.getElementById('timing-btn').classList.add('gone');
  document.getElementById('timing-overlay').classList.add('active');
  tIdx = 0;
  tResults = [];
  updateTimingUI();
  audio.currentTime = 0;
  audio.play();
  document.addEventListener('keydown', timingKey);
  tickTimingClock();
}

function tickTimingClock() {
  const t = audio.currentTime;
  const m = Math.floor(t / 60);
  const s = Math.floor(t % 60);
  document.getElementById('t-timer').textContent = m + ':' + String(s).padStart(2,'0');
  if (!audio.ended) tRaf = requestAnimationFrame(tickTimingClock);
}

function updateTimingUI() {
  const cur = LYRICS[tIdx];
  const nxt = LYRICS[tIdx + 1];
  document.getElementById('t-label').textContent =
    'Line ' + (tIdx + 1) + ' of ' + LYRICS.length + ' — press SPACEBAR when you hear it:';
  document.getElementById('t-next').textContent = cur.text || '[ ' + (cur.section || 'instrumental') + ' ]';
  document.getElementById('t-up').textContent = nxt ? (nxt.text || '[ next: ' + (nxt.section || 'instrumental') + ' ]') : '(last line)';
}

function timingKey(e) {
  if (e.code === 'Escape') { closeTimingMode(); return; }
  if (e.code !== 'Space') return;
  e.preventDefault();
  const t = Math.round(audio.currentTime * 10) / 10;
  tResults.push({ ...LYRICS[tIdx], start: t });
  tIdx++;
  if (tIdx >= LYRICS.length) {
    finishTimingMode();
  } else {
    updateTimingUI();
  }
}

function finishTimingMode() {
  document.removeEventListener('keydown', timingKey);
  cancelAnimationFrame(tRaf);
  audio.pause();
  document.getElementById('t-label').textContent = '✅ Done! Copy these timestamps and send them to Claude:';
  document.getElementById('t-next').textContent = '';
  document.getElementById('t-up').textContent = '';
  document.getElementById('t-timer').textContent = '';
  document.getElementById('t-hint').textContent = '';
  const lines = tResults.map(l =>
    '  { text: "' + l.text.replace(/"/g,'\\"') + '", start: ' + l.start + ', type: "' + l.type + '", section: "' + l.section + '" },'
  ).join('\n');
  const out = document.getElementById('t-results');
  out.textContent = lines;
  out.style.display = 'block';
  document.getElementById('t-copy').style.display = 'inline-block';
}

function copyTimings() {
  navigator.clipboard.writeText(document.getElementById('t-results').textContent)
    .then(() => { document.getElementById('t-copy').textContent = '✅ Copied!'; });
}

function closeTimingMode() {
  document.removeEventListener('keydown', timingKey);
  cancelAnimationFrame(tRaf);
  audio.pause(); audio.currentTime = 0;
  document.getElementById('timing-overlay').classList.remove('active');
  document.getElementById('t-results').style.display = 'none';
  document.getElementById('t-copy').style.display = 'none';
  document.getElementById('t-hint').textContent = 'SPACEBAR = stamp this line | ESC = cancel';
  document.getElementById('play-btn').classList.remove('gone');
  document.getElementById('timing-btn').classList.remove('gone');
}
</script>
</body>
</html>
